name: Release on Version Bump

on:
  push:
    branches:
      - main
    paths:
      - app/build.gradle.kts

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect versionName change
        id: version
        run: |
          current=$(grep 'versionName' app/build.gradle.kts | sed 's/.*versionName = "\(.*\)".*/\1/')
          previous=$(git show HEAD~1:app/build.gradle.kts 2>/dev/null | grep 'versionName' | sed 's/.*versionName = "\(.*\)".*/\1/' || true)

          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

          if [ -n "$previous" ] && [ "$current" != "$previous" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip when versionName is unchanged
        if: steps.version.outputs.changed != 'true'
        run: |
          echo "versionName unchanged (${{ steps.version.outputs.previous }} -> ${{ steps.version.outputs.current }}), skipping release."

      - name: Set up JDK 17
        if: steps.version.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: steps.version.outputs.changed == 'true'
        uses: android-actions/setup-android@v3

      - name: Build release artifacts
        if: steps.version.outputs.changed == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew releasePackage --stacktrace

      - name: Create GitHub Release
        if: steps.version.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.current }}
          name: TimeFlow v${{ steps.version.outputs.current }}
          generate_release_notes: true
          files: |
            timeflow/release/timeflow-${{ steps.version.outputs.current }}.apk
            timeflow/release/timeflow-${{ steps.version.outputs.current }}.aab
